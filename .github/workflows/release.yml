name: Build Mod

on:
  push:
    # 去掉分支限制，任何推送都触发（或保留您需要的分支）
  pull_request:
  workflow_dispatch:   # 保留手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 使用 Gradle 构建（自动下载并缓存 Gradle）
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'   # 指定 Gradle 版本（与 Fabric 兼容）

      - name: 构建模组
        run: gradle build   # 直接使用 gradle 命令（不依赖 wrapper）

      - name: 上传 JAR 包
        uses: actions/upload-artifact@v4
        with:
          name: manhunt-mod
          path: build/libs/*.jar
