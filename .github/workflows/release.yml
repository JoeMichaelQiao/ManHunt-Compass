name: Build and Release

on:
  push:
    branches:
      - 26.2-fabric
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # If you don't commit gradlew to repo, use gradle-build-action to install Gradle
      - name: Use Gradle (install if needed) and build
        uses: gradle/gradle-build-action@v2
        with:
          arguments: build
          gradle-version: 8.6 # or another Gradle version compatible with fabric-loom; adjust if needed

      - name: Upload build artifact (optional)
        uses: actions/upload-artifact@v4
        with:
          name: manhunt-compass-jar
          path: build/libs/*.jar

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          files: build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
