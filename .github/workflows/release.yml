name: Build Mod

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'        # 必须使用 Java 25

      - name: 使用 Gradle 构建（自动下载并缓存 Gradle）
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'    # 与 Gradle 8.13 兼容

      - name: 构建模组（强制使用正确 Java）
        run: |
          # 停止可能使用错误 Java 的旧 Daemon
          gradle --stop
          # 使用 --no-daemon 避免复用旧的 daemon，并通过 -D 显式指定 JAVA_HOME
          gradle build --no-daemon -Dorg.gradle.java.home=$JAVA_HOME

      - name: 上传 JAR 包
        uses: actions/upload-artifact@v4
        with:
          name: manhunt-mod
          path: build/libs/*.jar
