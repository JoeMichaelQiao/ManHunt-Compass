name: Build Mod

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: 下载并安装 Gradle 9.0.0-rc-1
        run: |
          wget https://services.gradle.org/distributions/gradle-9.0.0-rc-1-bin.zip
          unzip -q gradle-9.0.0-rc-1-bin.zip
          echo "$PWD/gradle-9.0.0-rc-1/bin" >> $GITHUB_PATH
          gradle --version

      - name: 构建模组（禁用守护进程，避免缓存干扰）
        run: gradle build --no-daemon

      - name: 上传 JAR 包
        uses: actions/upload-artifact@v4
        with:
          name: manhunt-mod
          path: build/libs/*.jar
