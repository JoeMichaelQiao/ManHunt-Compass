name: Build Mod

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 下载并安装 Gradle 9.0.0-rc-1（支持 Java 21）
        run: |
          wget https://services.gradle.org/distributions/gradle-9.0.0-rc-1-bin.zip
          unzip -q gradle-9.0.0-rc-1-bin.zip
          echo "$PWD/gradle-9.0.0-rc-1/bin" >> $GITHUB_PATH
          gradle --version

      - name: 升级 Fabric Loom 到最新快照（兼容 Java 21 + 1.21.4）
        run: |
          sed -i 's/id '\''fabric-loom'\'' version '\''1.10-SNAPSHOT'\''/id '\''fabric-loom'\'' version '\''1.12-SNAPSHOT'\''/' build.gradle
          echo "修改后的 build.gradle:"
          grep 'fabric-loom' build.gradle

      - name: 构建模组（强制指定 Minecraft 版本为 1.21.4）
        run: gradle build --no-daemon -Pminecraft_version=1.21.4

      - name: 上传 JAR 包
        uses: actions/upload-artifact@v4
        with:
          name: manhunt-mod
          path: build/libs/*.jar
